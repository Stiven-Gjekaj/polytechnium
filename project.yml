name: Polytechnium
options:
  bundleIdPrefix: io.github.stivengjekaj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    # A simulator build signs with no identity, so that the app and the widgets
    # share the app group there too.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "YES"
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
packages:
  PolyCore:
    path: PolyCore
targets:
  Polytechnium:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared/Sources
      - Shared/Resources
    dependencies:
      - package: PolyCore
      - target: PolytechniumWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.polytechnium
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        # The build does not sign. scripts/build-ipa.sh signs with no identity and
        # these entitlements, so that a sideload tool can see the app group.
        CODE_SIGN_ENTITLEMENTS: App/Polytechnium.entitlements
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: "YES"
  PolytechniumWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - Shared/Sources
      - Shared/Resources
      - path: App/Resources/Fonts/Karla.ttf
        buildPhase: resources
    dependencies:
      - package: PolyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.polytechnium.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: "YES"
schemes:
  Polytechnium:
    build:
      targets:
        Polytechnium: all
