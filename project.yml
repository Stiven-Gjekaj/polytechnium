name: Polytechnium
options:
  bundleIdPrefix: io.github.stivengjekaj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  PolyCore:
    path: PolyCore
targets:
  Polytechnium:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared/Sources
      - Shared/Resources
    dependencies:
      - package: PolyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.polytechnium
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        # The build does not sign. scripts/build-ipa.sh signs with no identity and
        # these entitlements, so that a sideload tool can see the app group.
        CODE_SIGN_ENTITLEMENTS: App/Polytechnium.entitlements
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: "YES"
schemes:
  Polytechnium:
    build:
      targets:
        Polytechnium: all
