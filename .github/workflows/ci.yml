name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the English and the Albanian text
        run: python3 scripts/strings.py --check
      - name: Test the core package
        run: swift test --package-path PolyCore
      # The IPA is a release build. The optimizer can change what the code does,
      # so the tests also run in that configuration.
      - name: Test the core package in a release build
        run: swift test -c release --package-path PolyCore
      - name: Build the IPA
        run: ./scripts/build-ipa.sh
